# Rebuilds Daybook on every push to main and saves the finished site in the repo root,
# so GitHub Pages works whether its Source is "Deploy from a branch" (main, root) or "GitHub Actions".
# Once Supabase is set up, add Repo → Settings → Secrets and variables → Actions → Variables:
#   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY, VITE_VAPID_PUBLIC_KEY
name: Publish site
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: write, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run publish:pages
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
      - name: Save the built site to main
        continue-on-error: true   # needs Settings → Actions → Workflow permissions: Read and write
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- . ':!dist' ':!node_modules'
          git diff --cached --quiet || (git commit -m "Publish site [skip ci]" && git push)
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      - name: Deploy (used when Pages source is "GitHub Actions")
        uses: actions/deploy-pages@v4
        continue-on-error: true
